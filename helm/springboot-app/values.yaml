replicas: 2

image:
  repository: kakarot-jenkins.myvnc.com/springboot-demo
  tag: latest

imagePullSecret: nexus-secret

port: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  host: springboot.example.com

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: false